[project]
name = "alphaforge"
version = "0.1.0"
description = "AlphaForge AI - orchestrateur multi-agents (Bedrock ou mock), API et interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "arch>=9.0.0",
    "boto3>=1.34",
    "catboost>=1.2.10",
    "chromadb>=1.5.9",
    "flask-cors>=6.0.5",
    "flask-restful>=0.3.10",
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.8.0",
    "langchain>=1.5.0",
    "langgraph>=1.2.22",
    "lightgbm>=4.7.0",
    "marshmallow>=4.4.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "numpy>=2.4.6",
    "optuna>=5.0.0",
    "plotly>=7.1.0",
    "pydantic-settings>=2",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
    "sqlalchemy>=2",
    "sqlparse>=0.5",
    "tavily-python>=0.8.5",
    "watchtower>=3",
    "xgboost>=3.2.0",
    "yfinance>=1.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["alphaforge*", "server*"]
