AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AlphaForge AI en ligne : interface + API dans un conteneur ECS Fargate (ARM64), derrière un Application Load Balancer
  et une distribution CloudFront (HTTPS). Le rôle de la tâche donne accès à Bedrock, au Guardrail et au bucket S3 ;
  aucun identifiant n'est stocké dans l'image ni dans la configuration. Déploiement : python deploy/deploy.py

Parameters:
  ImageUri:
    Type: String
    Description: Image ECR (construite et poussée par deploy/deploy.py)
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Au moins deux sous-réseaux publics (zones différentes)
  BucketName:
    Type: String
  BucketPrefix:
    Type: String
    Default: alphaforge
  GuardrailId:
    Type: String
  GuardrailVersion:
    Type: String
    Default: DRAFT
  LlmRoutes:
    Type: String
  LlmPricing:
    Type: String
    Default: "{}"
  LlmMaxTokens:
    Type: String
  LogGroupName:
    Type: String
    Default: /alphaforge/app
  AnalysesPerHour:
    Type: Number
    Default: 60
    Description: Plafond global d'analyses par heure (coût Bedrock d'un site public)
  CloudFrontPrefixList:
    Type: String
    Default: pl-3b927c52
    Description: Liste de préfixes « com.amazonaws.global.cloudfront.origin-facing » (us-east-1) ; seul CloudFront atteint le load balancer

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: alphaforge

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: alphaforge-app
          PolicyDocument:
            Statement:
              - Sid: Bedrock
                Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:  # profils d'inférence globaux : ils exigent aussi les modèles sous-jacents
                  - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
                  - arn:aws:bedrock:*::foundation-model/*
              - Sid: Guardrail
                Effect: Allow
                Action: bedrock:ApplyGuardrail
                Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/${GuardrailId}
              - Sid: Data
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub arn:aws:s3:::${BucketName}/${BucketPrefix}/*
              - Sid: List
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::${BucketName}

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: alphaforge
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "1024"
      Memory: "2048"
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Ref ImageUri
          PortMappings: [{ ContainerPort: 5000 }]
          Environment:
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: LLM_ROUTES, Value: !Ref LlmRoutes }
            - { Name: LLM_PRICING, Value: !Ref LlmPricing }
            - { Name: LLM_MAX_TOKENS, Value: !Ref LlmMaxTokens }
            - { Name: GUARDRAIL_ID, Value: !Ref GuardrailId }
            - { Name: GUARDRAIL_VERSION, Value: !Ref GuardrailVersion }
            - { Name: STORAGE_BACKEND, Value: s3 }
            - { Name: S3_BUCKET, Value: !Ref BucketName }
            - { Name: S3_PREFIX, Value: !Ref BucketPrefix }
            - { Name: MARKET_DATA, Value: yahoo }
            - { Name: CLOUDWATCH_METRICS, Value: "true" }  # métriques EMF extraites des logs awslogs
            - { Name: ANALYSES_PER_HOUR, Value: !Ref AnalysesPerHour }
            - { Name: TRUSTED_PROXIES, Value: "2" }  # CloudFront puis load balancer
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AlphaForge load balancer, joignable seulement par CloudFront
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, SourcePrefixListId: !Ref CloudFrontPrefixList }

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AlphaForge tache, joignable seulement par le load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5000, ToPort: 5000, SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup }

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: "300" }  # une analyse dure ~100 s

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 5000
      HealthCheckPath: /api/health
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1  # limites de débit en mémoire : une seule tâche
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED  # sortie vers Bedrock, S3 et Yahoo sans NAT
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - { ContainerName: app, ContainerPort: 5000, TargetGroupArn: !Ref TargetGroup }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: AlphaForge AI
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: app
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60  # le flux SSE envoie un battement toutes les 15 s
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: app
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled (géré par AWS)
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3  # AllViewer (géré par AWS)
          Compress: false  # pas de mise en tampon du flux SSE

Outputs:
  Url:
    Description: Adresse publique (HTTPS)
    Value: !Sub https://${Distribution.DomainName}
  LoadBalancer:
    Value: !GetAtt LoadBalancer.DNSName
